name: docker

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "version=$VERSION"
            echo "tags<<EOF"
            echo "ghcr.io/akik-forazi/fraziym-mcp:$VERSION"
            if [[ "$VERSION" == *-* ]]; then echo "ghcr.io/akik-forazi/fraziym-mcp:beta"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            FRAZIYM_MCP_VERSION=${{ steps.meta.outputs.version }}
