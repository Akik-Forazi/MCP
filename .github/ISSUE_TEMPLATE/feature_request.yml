name: Feature request
description: Propose a new tool, flag or behavior
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Tool signature, flag, or config shape you'd expect
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - New tool
        - Existing tool behavior
        - Protocol / transports
        - Gateway (router/fix/brain)
        - CLI / config
        - Packaging / distribution
    validations:
      required: true
